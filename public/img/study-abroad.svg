<svg xmlns="http://www.w3.org/2000/svg" width="300" height="290" viewBox="0 0 300 290" role="img" aria-label="Study abroad illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EAF7FF"/>
      <stop offset="55%" stop-color="#F3EEFF"/>
      <stop offset="100%" stop-color="#FFF2E8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#25C6F7"/>
      <stop offset="45%" stop-color="#7A5CFF"/>
      <stop offset="100%" stop-color="#FF8A3D"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#423B7A" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="300" height="290" rx="26" fill="url(#bg)"/>
  <circle cx="245" cy="55" r="28" fill="#FFD166" opacity="0.9"/>
  <circle cx="47" cy="238" r="34" fill="#61E4C5" opacity="0.25"/>
  <circle cx="40" cy="55" r="19" fill="#8B6CFF" opacity="0.15"/>

  <!-- Globe -->
  <g filter="url(#shadow)">
    <circle cx="150" cy="128" r="65" fill="#ffffff"/>
    <circle cx="150" cy="128" r="56" fill="#DFF7FF" stroke="#36B7F0" stroke-width="3"/>
    <path d="M97 128h106M150 72c19 16 29 35 29 56s-10 40-29 56M150 72c-19 16-29 35-29 56s10 40 29 56" fill="none" stroke="#36B7F0" stroke-width="2" opacity="0.85"/>
    <path d="M110 94c18 8 63 8 80 0M110 162c18-8 63-8 80 0" fill="none" stroke="#36B7F0" stroke-width="2" opacity="0.85"/>
    <path d="M126 99l19-8 20 13-8 16 17 13-10 23-25-6-19 13-12-18 12-20-14-9z" fill="#58D39B" opacity="0.95"/>
    <path d="M171 84l20 9 7 24-18-7-15-13z" fill="#58D39B" opacity="0.9"/>
  </g>

  <!-- Airplane -->
  <g transform="translate(44 72) rotate(-18)" filter="url(#shadow)">
    <path d="M2 27l91-25c7-2 12 6 7 11L75 39l8 33c1 5-5 8-9 4L54 55 31 76c-4 4-11 0-9-6l10-29L4 34c-5-1-6-6-2-7z" fill="url(#accent)"/>
    <path d="M34 40l59-31-43 41z" fill="#ffffff" opacity="0.75"/>
  </g>

  <!-- Graduation cap -->
  <g transform="translate(178 184)" filter="url(#shadow)">
    <path d="M-54 0L0-21 54 0 0 22z" fill="#2B2D42"/>
    <path d="M-28 10v22c14 13 42 13 56 0V10L0 22z" fill="#3B3F66"/>
    <path d="M54 0v34" stroke="#FFB703" stroke-width="4" stroke-linecap="round"/>
    <circle cx="54" cy="39" r="6" fill="#FFB703"/>
  </g>

  <!-- Passport / document -->
  <g transform="translate(45 185) rotate(-5)" filter="url(#shadow)">
    <rect x="0" y="0" width="72" height="88" rx="10" fill="#4D6BFF"/>
    <rect x="12" y="14" width="48" height="11" rx="5" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="36" cy="48" r="16" fill="#FFFFFF" opacity="0.95"/>
    <path d="M20 48h32M36 32c6 5 9 10 9 16s-3 11-9 16M36 32c-6 5-9 10-9 16s3 11 9 16" stroke="#4D6BFF" stroke-width="2" fill="none"/>
    <rect x="15" y="70" width="42" height="6" rx="3" fill="#FFFFFF" opacity="0.85"/>
  </g>

  <!-- Small decorative elements -->
  <path d="M237 157l12 6 12-6-12-6z" fill="#FF8A3D" opacity="0.9"/>
  <path d="M65 133l9 5 9-5-9-5z" fill="#7A5CFF" opacity="0.7"/>
  <path d="M223 214c14-6 27-1 35 10" fill="none" stroke="#7A5CFF" stroke-width="4" stroke-linecap="round" opacity="0.45"/>
</svg>
