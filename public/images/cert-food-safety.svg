<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0fdf4"/>
      <stop offset="100%" style="stop-color:#dcfce7"/>
    </linearGradient>
    <linearGradient id="header" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#14532d"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="560" fill="url(#bg)" rx="12"/>
  <!-- Outer border -->
  <rect x="12" y="12" width="776" height="536" fill="none" stroke="#16a34a" stroke-width="3" rx="8"/>
  <!-- Inner border -->
  <rect x="22" y="22" width="756" height="516" fill="none" stroke="#16a34a" stroke-width="1" stroke-dasharray="8,4" rx="6"/>
  <!-- Header band -->
  <rect x="0" y="0" width="800" height="120" fill="url(#header)" rx="12"/>
  <rect x="0" y="108" width="800" height="12" fill="url(#header)"/>
  <!-- Header text -->
  <text x="400" y="48" font-family="Georgia, serif" font-size="13" fill="rgba(255,255,255,0.7)" text-anchor="middle" letter-spacing="6">HEALTH &amp; SAFETY AUTHORITY</text>
  <text x="400" y="82" font-family="Georgia, serif" font-size="28" font-weight="bold" fill="white" text-anchor="middle">Certificate of Compliance</text>
  <text x="400" y="104" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.65)" text-anchor="middle" letter-spacing="3">OFFICIAL DOCUMENT</text>
  <!-- Seal circle left -->
  <circle cx="68" cy="60" r="42" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
  <circle cx="68" cy="60" r="34" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="68" y="55" font-family="Arial" font-size="22" fill="rgba(255,255,255,0.5)" text-anchor="middle">✓</text>
  <text x="68" y="72" font-family="Arial" font-size="7" fill="rgba(255,255,255,0.4)" text-anchor="middle" letter-spacing="1">CERTIFIED</text>
  <!-- Seal circle right -->
  <circle cx="732" cy="60" r="42" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
  <circle cx="732" cy="60" r="34" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="732" y="55" font-family="Arial" font-size="22" fill="rgba(255,255,255,0.5)" text-anchor="middle">✓</text>
  <text x="732" y="72" font-family="Arial" font-size="7" fill="rgba(255,255,255,0.4)" text-anchor="middle" letter-spacing="1">VERIFIED</text>
  <!-- Body -->
  <text x="400" y="175" font-family="Georgia, serif" font-size="14" fill="#4b5563" text-anchor="middle" letter-spacing="2">THIS IS TO CERTIFY THAT</text>
  <text x="400" y="218" font-family="Georgia, serif" font-size="36" font-weight="bold" fill="#14532d" text-anchor="middle">L'Aura Brasserie</text>
  <line x1="180" y1="228" x2="620" y2="228" stroke="#16a34a" stroke-width="1.5"/>
  <text x="400" y="250" font-family="Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">123 Culinary Blvd, Downtown Arts District, Cityville ST 12345</text>
  <text x="400" y="285" font-family="Georgia, serif" font-size="15" fill="#374151" text-anchor="middle">has successfully met all requirements for</text>
  <rect x="200" y="300" width="400" height="50" fill="#16a34a" rx="8"/>
  <text x="400" y="331" font-family="Georgia, serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">Food Safety Level 5</text>
  <!-- Details row -->
  <rect x="80" y="370" width="180" height="60" fill="white" rx="8" stroke="#d1fae5" stroke-width="1"/>
  <text x="170" y="393" font-family="Arial" font-size="9" fill="#9ca3af" text-anchor="middle" letter-spacing="1">CERTIFICATE NO.</text>
  <text x="170" y="414" font-family="Arial" font-size="12" font-weight="bold" fill="#14532d" text-anchor="middle">HSA-2025-FS-4821</text>
  <rect x="310" y="370" width="180" height="60" fill="white" rx="8" stroke="#d1fae5" stroke-width="1"/>
  <text x="400" y="393" font-family="Arial" font-size="9" fill="#9ca3af" text-anchor="middle" letter-spacing="1">DATE ISSUED</text>
  <text x="400" y="414" font-family="Arial" font-size="12" font-weight="bold" fill="#14532d" text-anchor="middle">01 January 2025</text>
  <rect x="540" y="370" width="180" height="60" fill="white" rx="8" stroke="#d1fae5" stroke-width="1"/>
  <text x="630" y="393" font-family="Arial" font-size="9" fill="#9ca3af" text-anchor="middle" letter-spacing="1">VALID UNTIL</text>
  <text x="630" y="414" font-family="Arial" font-size="12" font-weight="bold" fill="#14532d" text-anchor="middle">31 December 2026</text>
  <!-- Signature line -->
  <line x1="120" y1="490" x2="310" y2="490" stroke="#9ca3af" stroke-width="1"/>
  <text x="215" y="505" font-family="Arial" font-size="9" fill="#9ca3af" text-anchor="middle" letter-spacing="1">DIRECTOR OF FOOD SAFETY</text>
  <!-- Official seal -->
  <circle cx="400" cy="480" r="36" fill="none" stroke="#16a34a" stroke-width="2"/>
  <circle cx="400" cy="480" r="30" fill="#f0fdf4" stroke="#16a34a" stroke-width="1"/>
  <text x="400" y="476" font-family="Arial" font-size="18" fill="#16a34a" text-anchor="middle">✓</text>
  <text x="400" y="490" font-family="Arial" font-size="7" fill="#16a34a" text-anchor="middle" letter-spacing="1">OFFICIAL</text>
  <!-- Right signature -->
  <line x1="490" y1="490" x2="680" y2="490" stroke="#9ca3af" stroke-width="1"/>
  <text x="585" y="505" font-family="Arial" font-size="9" fill="#9ca3af" text-anchor="middle" letter-spacing="1">CHIEF INSPECTOR</text>
  <!-- Corner ornaments -->
  <text x="42" y="165" font-family="Arial" font-size="28" fill="#d1fae5">❧</text>
  <text x="736" y="165" font-family="Arial" font-size="28" fill="#d1fae5" text-anchor="end">❧</text>
</svg>
